<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>洪拳 · Hung Kuen</title>
  <meta name="description" content="洪拳主题的俯视角武侠动作小游戏：自动出手清怪、拾气升级、三选一习得武学，最终击败关底 Boss「山贼头目」。" />

  <!-- 分享预览（微信/QQ/推特等） -->
  <meta property="og:title" content="洪拳 · Hung Kuen" />
  <meta property="og:description" content="俯视角武侠动作小游戏：WASD 游走、按住 J 自动连击、K 惊涛叠浪清场，武学三选一，斩王通关。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://13413183976txy-debug.github.io/hung-kuen/" />
  <meta property="og:image" content="https://13413183976txy-debug.github.io/hung-kuen/assets/sprites/ui/victory.png?v=17" />

  <meta name="theme-color" content="#17130F" />
  <link rel="icon" type="image/png" href="assets/sprites/hero/idle.png?v=17" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- 游戏画布 -->
  <canvas id="game"></canvas>

  <!-- UI 覆盖层（标题/选招/胜利/失败 全部在此层，由 screens.js 注入） -->
  <div id="ui-layer"></div>

  <!-- 提示 -->
  <div id="boot-tip" style="display:none">加载中…</div>

  <!-- 按依赖顺序加载 ES Modules（需静态服务器，勿用 file://） -->
  <script type="module" src="js/main.js?v=18"></script>

  <!-- 兜底：模块加载失败（缓存混用/服务器异常）时给出明确提示而非黑屏 -->
  <script>
    setTimeout(function () {
      if (!window.__hg) {
        var tip = document.getElementById('boot-tip');
        if (tip) {
          tip.style.display = 'flex';
          tip.textContent = '脚本加载失败：请强制刷新（Ctrl + F5），并确认 http 服务器仍在运行';
        }
      }
    }, 4000);
  </script>
</body>

</html>
